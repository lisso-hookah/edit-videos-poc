[project]
name = "edit-videos-poc"
version = "0.0.1"
description = "Video editing PoC: silence cut, transcription, subtitle, render"
requires-python = ">=3.11"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "faster-whisper>=1.0.0",
    "google-generativeai>=0.8.0",
    "srt>=3.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edit_videos_poc"]

[tool.ruff]
line-length = 100
target-version = "py311"
