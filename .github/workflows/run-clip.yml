name: Clip Video

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "リポジトリ内の動画ファイルパス (例: samples/input.mp4) — Lollipop モード時は不要"
        required: false
        default: ""
        type: string
      lollipop_api_url:
        description: "Lollipop API の URL (例: https://your-domain.example.com) — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      job_id:
        description: "Lollipop ジョブ ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      file_id:
        description: "Lollipop アップロードファイル ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      start_time:
        description: "切り抜き開始時間 (秒 または HH:MM:SS)"
        required: false
        default: "0"
        type: string
      end_time:
        description: "切り抜き終了時間 (秒 または HH:MM:SS、未指定で動画末尾まで)"
        default: ""
        required: false
        type: string
      top_text:
        description: "上部に表示するテキスト (省略可)"
        default: ""
        required: false
        type: string
      bottom_text:
        description: "下部に表示するテキスト (省略可)"
        default: ""
        required: false
        type: string
      text_color:
        description: "テキストの色 (white / yellow / red / black など)"
        default: "white"
        required: false
        type: string
      font_size:
        description: "テキストのフォントサイズ"
        default: "108"
        required: false
        type: string

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig

      - name: Install custom font
        run: |
          curl -fL "https://font.sumomo.ne.jp/fontdata-c2157415/k-font.zip" -o /tmp/k-font.zip
          unzip /tmp/k-font.zip -d /tmp/k-font/
          sudo mkdir -p /usr/local/share/fonts/k-font
          find /tmp/k-font -name "*.ttf" -o -name "*.otf" | xargs -I{} sudo cp {} /usr/local/share/fonts/k-font/
          sudo fc-cache -fv
          FONT_FILE=$(find /tmp/k-font -name "*.ttf" -o -name "*.otf" | head -1)
          FONT_NAME=$(fc-query --format="%{family[0]}\n" "$FONT_FILE" | head -1)
          echo "CLIP_FONT=$FONT_NAME" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Download video from Lollipop
        if: ${{ inputs.lollipop_api_url != '' && inputs.file_id != '' }}
        run: |
          for i in 1 2 3; do
            curl -fL \
              --connect-timeout 60 \
              --max-time 600 \
              -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
              "${{ inputs.lollipop_api_url }}/api/worker/uploads/${{ inputs.file_id }}" \
              -o input_video.mp4 && break
            echo "Download attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "VIDEO_PATH=input_video.mp4" >> "$GITHUB_ENV"

      - name: Set video path (direct mode)
        if: ${{ inputs.lollipop_api_url == '' }}
        run: echo "VIDEO_PATH=${{ inputs.video_path }}" >> "$GITHUB_ENV"

      - name: Update progress — 処理開始
        if: ${{ inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"progress":5,"progress_label":"GitHub Actions 処理開始"}' \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/progress" || true

      - name: Run clip
        env:
          WORK_DIR: ./output
        run: |
          ARGS="$VIDEO_PATH --start ${{ inputs.start_time }}"
          ARGS="$ARGS --font \"$CLIP_FONT\""
          ARGS="$ARGS --font-size ${{ inputs.font_size }}"
          ARGS="$ARGS --text-color ${{ inputs.text_color }}"
          if [ -n "${{ inputs.end_time }}" ]; then
            ARGS="$ARGS --end ${{ inputs.end_time }}"
          fi
          if [ -n "${{ inputs.top_text }}" ]; then
            ARGS="$ARGS --top-text \"${{ inputs.top_text }}\""
          fi
          if [ -n "${{ inputs.bottom_text }}" ]; then
            ARGS="$ARGS --bottom-text \"${{ inputs.bottom_text }}\""
          fi
          eval python scripts/run_clip.py $ARGS

      - name: Upload result to Lollipop
        if: ${{ success() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          RESULT=$(find output/clip -name "*.mp4" | head -1)
          if [ -z "$RESULT" ]; then
            echo "ERROR: 結果ファイルが見つかりません"
            exit 1
          fi
          echo "Result size: $(du -sh $RESULT | cut -f1)"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          UPLOADED=false
          for i in 1 2 3; do
            echo "Upload attempt $i..."
            curl -fL -X POST \
              --connect-timeout 60 \
              --max-time 600 \
              -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
              -F "file=@$RESULT;type=video/mp4" \
              "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/complete" \
              && UPLOADED=true && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          if [ "$UPLOADED" = "false" ]; then
            echo "Direct upload failed. Reporting artifact URL: $RUN_URL"
            curl -s -X POST \
              -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
              -H "Content-Type: application/json" \
              -d "{\"artifact_url\":\"$RUN_URL\"}" \
              "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/complete" || true
          fi

      - name: Report failure to Lollipop
        if: ${{ failure() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"error\":\"GitHub Actions ジョブが失敗しました (run: ${{ github.run_id }})\"}" \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/fail" || true

      - name: Upload output (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-output
          path: output/clip/
          retention-days: 7
