name: Run Video Pipeline

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "リポジトリ内の動画ファイルパス (例: videos/input.mp4) — Lollipop モード時は不要"
        required: false
        default: ""
        type: string
      lollipop_api_url:
        description: "Lollipop API の URL (例: https://your-domain.example.com) — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      job_id:
        description: "Lollipop ジョブ ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      file_id:
        description: "Lollipop アップロードファイル ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      language:
        description: "文字起こし言語 (ja / en など)"
        default: "ja"
        required: false
        type: string
      whisper_model:
        description: "Whisper モデル (tiny / base / small / medium / large-v3)"
        default: "medium"
        required: false
        type: string
      skip_refine:
        description: "Gemini によるフィラー除去をスキップする"
        default: "false"
        required: false
        type: string
      noise_db:
        description: "無音判定閾値 (dB, 例: -30)"
        default: "-30"
        required: false
        type: string
      min_silence:
        description: "最小無音長 (秒, 例: 0.5)"
        default: "0.5"
        required: false
        type: string
      font_color:
        description: "字幕の文字色 (yellow / white / red / black / blue / green / orange など)"
        default: "yellow"
        required: false
        type: string
      subtitle_style:
        description: "字幕スタイルプリセット (default / news / pop / karaoke / minimal / telop / neon)"
        default: "default"
        required: false
        type: string
      subtitle_position:
        description: "字幕の位置 (bottom / top / middle / lower-third / upper-third)"
        default: "bottom"
        required: false
        type: string
      thumbnail:
        description: "gpt-image-2 でサムネイル画像を生成する (OPENAI_API_KEY が必要)"
        default: "false"
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig

      - name: Install custom font
        run: |
          curl -fL "https://font.sumomo.ne.jp/fontdata-c2157415/k-font.zip" -o /tmp/k-font.zip
          unzip /tmp/k-font.zip -d /tmp/k-font/
          sudo mkdir -p /usr/local/share/fonts/k-font
          find /tmp/k-font -name "*.ttf" -o -name "*.otf" | xargs -I{} sudo cp {} /usr/local/share/fonts/k-font/
          sudo fc-cache -fv
          FONT_FILE=$(find /tmp/k-font -name "*.ttf" -o -name "*.otf" | head -1)
          FONT_NAME=$(fc-query --format="%{family[0]}\n" "$FONT_FILE" | head -1)
          echo "SUBTITLE_FONT=$FONT_NAME" >> "$GITHUB_ENV"
          echo "Installed font: $FONT_NAME"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Download video from Lollipop
        if: ${{ inputs.lollipop_api_url != '' && inputs.file_id != '' }}
        run: |
          curl -fL \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            "${{ inputs.lollipop_api_url }}/api/worker/uploads/${{ inputs.file_id }}" \
            -o input_video.mp4
          echo "VIDEO_PATH=input_video.mp4" >> "$GITHUB_ENV"

      - name: Set video path (direct mode)
        if: ${{ inputs.lollipop_api_url == '' }}
        run: echo "VIDEO_PATH=${{ inputs.video_path }}" >> "$GITHUB_ENV"

      - name: Update progress — 処理開始
        if: ${{ inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"progress":5,"progress_label":"GitHub Actions 処理開始"}' \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/progress" || true

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          WORK_DIR: ./output
        run: |
          ARGS="$VIDEO_PATH --language ${{ inputs.language }}"
          ARGS="$ARGS --noise-db ${{ inputs.noise_db }}"
          ARGS="$ARGS --min-silence ${{ inputs.min_silence }}"
          ARGS="$ARGS --font \"$SUBTITLE_FONT\""
          ARGS="$ARGS --font-color \"${{ inputs.font_color }}\""
          ARGS="$ARGS --subtitle-style \"${{ inputs.subtitle_style }}\""
          ARGS="$ARGS --subtitle-position \"${{ inputs.subtitle_position }}\""
          if [ "${{ inputs.skip_refine }}" = "true" ]; then
            ARGS="$ARGS --skip-refine"
          fi
          if [ "${{ inputs.thumbnail }}" = "true" ]; then
            ARGS="$ARGS --thumbnail"
          fi
          eval python scripts/run_pipeline.py $ARGS

      - name: Upload result to Lollipop
        if: ${{ success() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          RESULT=$(find output/render -name "*.mp4" | head -1)
          if [ -z "$RESULT" ]; then
            echo "ERROR: 結果ファイルが見つかりません"
            exit 1
          fi
          curl -fL -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -F "file=@$RESULT;type=video/mp4" \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/complete"

      - name: Report failure to Lollipop
        if: ${{ failure() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"error\":\"GitHub Actions ジョブが失敗しました (run: ${{ github.run_id }})\"}" \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/fail" || true

      - name: Upload rendered video (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-output
          path: output/
          retention-days: 7
