name: Run Short Video Pipeline

on:
  workflow_dispatch:
    inputs:
      video_path:
        description: "リポジトリ内の動画ファイルパス (例: samples/input.mp4) — Lollipop モード時は不要"
        required: false
        default: ""
        type: string
      lollipop_api_url:
        description: "Lollipop API の URL (例: https://your-domain.example.com) — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      job_id:
        description: "Lollipop ジョブ ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      file_id:
        description: "Lollipop アップロードファイル ID — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      lollipop_bg_file_id:
        description: "Lollipop 背景画像ファイル ID (background_type=image 時) — Lollipop モード時に設定"
        required: false
        default: ""
        type: string
      language:
        description: "文字起こし言語 (ja / en など)"
        default: "ja"
        required: false
        type: string
      whisper_model:
        description: "Whisper モデル (tiny / base / small / medium / large-v3)"
        default: "medium"
        required: false
        type: string
      skip_refine:
        description: "Gemini によるフィラー除去をスキップする"
        default: "false"
        required: false
        type: string
      font_color:
        description: "字幕文字色 (yellow / white / red / black / blue など)"
        default: "yellow"
        required: false
        type: string
      background_type:
        description: "背景の種類: blur=動画ぼかし / color=単色 / image=指定画像ぼかし"
        default: "blur"
        required: false
        type: string
      background_color:
        description: "単色背景の色 (background_type=color のとき使用: black / white / など)"
        default: "black"
        required: false
        type: string
      background_image:
        description: "背景画像パス (background_type=image かつ直接モード時: 例 samples/bg.jpg)"
        default: ""
        required: false
        type: string
      blur_sigma:
        description: "ぼかし強度 (blur / image のとき使用, デフォルト: 40)"
        default: "40"
        required: false
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fontconfig

      - name: Install custom font
        run: |
          curl -fL "https://font.sumomo.ne.jp/fontdata-c2157415/k-font.zip" -o /tmp/k-font.zip
          unzip /tmp/k-font.zip -d /tmp/k-font/
          sudo mkdir -p /usr/local/share/fonts/k-font
          find /tmp/k-font -name "*.ttf" -o -name "*.otf" | xargs -I{} sudo cp {} /usr/local/share/fonts/k-font/
          sudo fc-cache -fv
          FONT_FILE=$(find /tmp/k-font -name "*.ttf" -o -name "*.otf" | head -1)
          FONT_NAME=$(fc-query --format="%{family[0]}\n" "$FONT_FILE" | head -1)
          echo "SUBTITLE_FONT=$FONT_NAME" >> "$GITHUB_ENV"
          echo "Installed font: $FONT_NAME"

      - name: Install Python dependencies
        run: pip install -e .

      - name: Download video from Lollipop
        if: ${{ inputs.lollipop_api_url != '' && inputs.file_id != '' }}
        run: |
          curl -fL \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            "${{ inputs.lollipop_api_url }}/api/worker/uploads/${{ inputs.file_id }}" \
            -o input_video.mp4
          echo "VIDEO_PATH=input_video.mp4" >> "$GITHUB_ENV"

      - name: Download background image from Lollipop
        if: ${{ inputs.lollipop_api_url != '' && inputs.lollipop_bg_file_id != '' }}
        run: |
          curl -fL \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            "${{ inputs.lollipop_api_url }}/api/worker/uploads/${{ inputs.lollipop_bg_file_id }}" \
            -o bg_image.jpg
          echo "BG_IMAGE_PATH=bg_image.jpg" >> "$GITHUB_ENV"

      - name: Set video path (direct mode)
        if: ${{ inputs.lollipop_api_url == '' }}
        run: |
          echo "VIDEO_PATH=${{ inputs.video_path }}" >> "$GITHUB_ENV"
          if [ -n "${{ inputs.background_image }}" ]; then
            echo "BG_IMAGE_PATH=${{ inputs.background_image }}" >> "$GITHUB_ENV"
          fi

      - name: Update progress — 処理開始
        if: ${{ inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"progress":5,"progress_label":"GitHub Actions 処理開始"}' \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/progress" || true

      - name: Run short pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHISPER_MODEL: ${{ inputs.whisper_model }}
          WORK_DIR: ./output
        run: |
          ARGS="$VIDEO_PATH --language ${{ inputs.language }}"
          ARGS="$ARGS --font \"$SUBTITLE_FONT\""
          ARGS="$ARGS --font-color ${{ inputs.font_color }}"
          ARGS="$ARGS --blur-sigma ${{ inputs.blur_sigma }}"
          if [ "${{ inputs.skip_refine }}" = "true" ]; then
            ARGS="$ARGS --skip-refine"
          fi
          if [ "${{ inputs.background_type }}" = "color" ]; then
            ARGS="$ARGS --bg-color ${{ inputs.background_color }}"
          elif [ "${{ inputs.background_type }}" = "image" ] && [ -n "$BG_IMAGE_PATH" ]; then
            ARGS="$ARGS --bg-image $BG_IMAGE_PATH"
          fi
          eval python scripts/run_short.py $ARGS

      - name: Upload result to Lollipop
        if: ${{ success() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          RESULT=$(find output/vertical -name "*.mp4" | head -1)
          if [ -z "$RESULT" ]; then
            echo "ERROR: 結果ファイルが見つかりません"
            exit 1
          fi
          curl -fL -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -F "file=@$RESULT;type=video/mp4" \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/complete"

      - name: Report failure to Lollipop
        if: ${{ failure() && inputs.lollipop_api_url != '' && inputs.job_id != '' }}
        run: |
          curl -s -X POST \
            -H "X-Worker-Key: ${{ secrets.LOLLIPOP_WORKER_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"error\":\"GitHub Actions ジョブが失敗しました (run: ${{ github.run_id }})\"}" \
            "${{ inputs.lollipop_api_url }}/api/worker/jobs/${{ inputs.job_id }}/fail" || true

      - name: Upload output (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-output
          path: output/
          retention-days: 7
